<!doctype html><html><head><meta charset="utf-8"><title>Asset viewer</title>
<style>html,body{margin:0;background:#2b2b2b;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/nm/three/build/three.module.js","three/addons/":"/nm/three/examples/jsm/"}}</script></head>
<body><script type="module">
// Neutral studio viewer for asset sign-off: RoomEnvironment IBL, one soft key, no page post-processing.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1200), H = +(q.get('h') || 900);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = +(q.get('exp') || 1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') || '#3a3a3a');
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = +(q.get('env') || 1);
const key = new THREE.DirectionalLight('#fff4e6', +(q.get('key') || 1.5)); key.position.set(-2, 4, 3); scene.add(key);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.005, 50);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
loader.load(q.get('glb'), g => {
  const root = g.scene; scene.add(root);
  const c = new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3()); root.position.sub(c); root.updateMatrixWorld(true);
  if (q.get('clay') === '1') root.traverse(o => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: /emit_|lens_|Difusor|LED light|#43|WH1#1/.test(o.material.name) ? '#ffcf7a' : /black|BK2|baffle|cable|#33|Empty/.test(o.material.name) ? '#3a3a3a' : '#d8d8d8', roughness: 0.5, metalness: 0 }); });
  if (q.get('glow') === '1') root.traverse(o => { if (o.isMesh && /^emit_|^lens_/.test(o.material.name)) { o.material.emissive?.set('#ffd8a8'); o.material.emissiveIntensity = 4; } });
  window.__root = root; window.__ready = true;
});
const V = (s) => new THREE.Vector3(...s.split(',').map(Number));
window.shoot = (target, dir, dist, fov = 30) => {
  const o = window.__root.getObjectByName(target) || window.__root;
  const t = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.position.copy(t).add(V(dir).normalize().multiplyScalar(dist)); camera.lookAt(t);
  renderer.render(scene, camera); return renderer.info.render;
};
</script></body></html>
